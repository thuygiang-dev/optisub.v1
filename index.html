<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OptiSub — Cố vấn chi tiêu số cho sinh viên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#E8173F; --brand-2:#F5476A; --brand-deep:#C80F33; --brand-soft:#FDE7EC; --ring:#FBE4E9;
  --hdr-a:#F0284D; --hdr-b:#FF4F8B; --hdr-c:#FF8A4C;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F2F4; --ink:#16161A; --muted:#6B6B73; --line:#E8E8EC;
  --accent:var(--brand); --accent-soft:var(--brand-soft); --on-accent:#FFFFFF;
  --leak:#D3112F; --leak-soft:#FDE4E8; --warn:#B86A00; --warn-soft:#FFF1DA;
  --ok:#0B8F4D; --ok-soft:#E1F5EA; --trial:#0C7D9C; --trial-soft:#DFF2F8;
  --nav-bg:rgba(255,255,255,.92); --shadow:0 8px 28px rgba(22,22,26,.12);
  color-scheme:light; box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#FF3B5F; --brand-2:#FF6782; --brand-deep:#E8173F; --brand-soft:#3A1720; --ring:#3A1C24;
    --hdr-a:#B30D33; --hdr-b:#C2185B; --hdr-c:#D9542B;
    --bg:#111114; --surface:#1B1B20; --surface-2:#26262C; --ink:#F1F1F4; --muted:#A0A0AA; --line:#2E2E35;
    --on-accent:#FFFFFF; --leak:#FF6B80; --leak-soft:#3B1A21; --warn:#F2A93B; --warn-soft:#3A2C14;
    --ok:#3CCB86; --ok-soft:#14321F; --trial:#55C6E3; --trial-soft:#13303A;
    --nav-bg:rgba(30,30,36,.92); --shadow:0 8px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand:#FF3B5F; --brand-2:#FF6782; --brand-deep:#E8173F; --brand-soft:#3A1720; --ring:#3A1C24;
  --hdr-a:#B30D33; --hdr-b:#C2185B; --hdr-c:#D9542B;
  --bg:#111114; --surface:#1B1B20; --surface-2:#26262C; --ink:#F1F1F4; --muted:#A0A0AA; --line:#2E2E35;
  --on-accent:#FFFFFF; --leak:#FF6B80; --leak-soft:#3B1A21; --warn:#F2A93B; --warn-soft:#3A2C14;
  --ok:#3CCB86; --ok-soft:#14321F; --trial:#55C6E3; --trial-soft:#13303A;
  --nav-bg:rgba(30,30,36,.92); --shadow:0 8px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ===== Red header ===== */
.hdr{position:relative;overflow:hidden;overflow:clip;background:linear-gradient(135deg,var(--hdr-b) 0%,var(--hdr-a) 48%,var(--hdr-c) 100%);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.hdr-deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hdr-inner{position:relative;max-width:560px;margin:0 auto;padding:26px 20px 22px;display:flex;align-items:flex-start;gap:12px}
.hdr-title{font-size:25px;font-weight:700;letter-spacing:-.01em;line-height:1.2;text-transform:uppercase;margin:0}
.hdr-title.page{text-transform:none;font-size:26px}
.badge{margin-top:12px;display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:0;cursor:pointer;background:linear-gradient(90deg,#FFE7B8,#FFF6E0);color:#4A3200;font-weight:600;font-size:13.5px;box-shadow:0 2px 6px rgba(120,0,20,.18)}
.badge .em{width:26px;height:26px;border-radius:50%;background:linear-gradient(160deg,#F7A21B,#E36414);display:grid;place-items:center;font-size:15px}
.badge svg{width:15px;height:15px;stroke-width:2.4}
.hdr-sub{margin:8px 0 0;font-size:14px;opacity:.9}
.hdr-actions{margin-left:auto;display:flex;gap:8px;flex:none}
.hdr-inner>div:first-child{min-width:0;flex:1}
.hdr-title.page{font-size:24px!important}
@media (max-width:420px){.round{width:42px!important;height:42px!important}}
.round{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.28);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.round.solid{background:#fff;color:var(--brand)}
.round svg.i{width:23px;height:23px;stroke-width:2}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;margin:28px 0 0}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.sync.on i{background:var(--ok)}

/* notch tabs (Sinh viên) */
.strip{position:relative;max-width:560px;margin:0 auto;display:flex;gap:4px;padding:0 6px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;border:0;background:none;color:#fff;font-weight:600;font-size:15px;padding:13px 14px 15px;display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:22px 22px 0 0;position:relative}
.strip button svg.i{width:20px;height:20px}
.strip button[aria-selected="true"]{background:var(--bg);color:var(--brand)}
.strip button[aria-selected="true"]::before,.strip button[aria-selected="true"]::after{content:"";position:absolute;bottom:0;width:22px;height:22px;background:transparent;pointer-events:none}
.strip button[aria-selected="true"]::before{left:-22px;border-bottom-right-radius:22px;box-shadow:8px 8px 0 8px var(--bg)}
.strip button[aria-selected="true"]::after{right:-22px;border-bottom-left-radius:22px;box-shadow:-8px 8px 0 8px var(--bg)}
.hdr.has-strip .hdr-inner{padding-bottom:16px}
.hdr:not(.has-strip){border-radius:0 0 28px 28px}

/* ===== Auth ===== */
body.auth #nav{display:none}
.hdr.auth-hdr{border-radius:0 0 36px 36px}
.hdr.auth-hdr .hdr-inner{flex-direction:column;align-items:center;text-align:center;padding:44px 20px 92px}
.logo{width:72px;height:72px;border-radius:24px;background:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(120,0,25,.25)}
.logo svg{width:44px;height:44px}
.auth-title{margin:16px 0 0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.auth-sub{margin:6px 0 0;opacity:.92;font-size:15px}
.auth-card{position:relative;margin:-72px auto 0;max-width:528px;background:var(--surface);border:3px solid var(--ring);border-radius:28px;padding:18px 18px 22px;box-shadow:var(--shadow)}
.auth-card form{display:grid;gap:14px;margin-top:4px}
.pw{position:relative}
.pw input{padding-right:48px !important}
.pw .eye{position:absolute;right:8px;bottom:9px}
.check{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ink);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--brand);margin:0}
.auth-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.err{background:var(--leak-soft);color:var(--leak);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:500}
.auth-card .btn.primary{width:100%;padding:14px;font-size:16px}
.devs{margin-top:22px}
.devs h3{font-size:15px;color:var(--muted);font-weight:600;margin:0 4px 10px}
.dev{display:flex;align-items:center;gap:12px;width:100%;border:3px solid var(--ring);background:var(--surface);border-radius:20px;padding:10px 14px;cursor:pointer;text-align:left;margin-bottom:10px}
.dev .who{font-weight:700}
.dev .u{font-size:13px;color:var(--muted)}
.dev svg.i{margin-left:auto;color:var(--muted);width:18px;height:18px}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(150deg,var(--brand),var(--brand-2));font-size:16px}
.av.lg{width:72px;height:72px;font-size:28px}
.round.av-btn{background:#fff;color:var(--brand);font-weight:800;font-size:17px}
.auth-foot{margin:22px 8px 0;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.55}
.acc-top{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:4px 0 8px}
.menu{display:grid;border:3px solid var(--ring);border-radius:20px;overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;border:0;border-top:1.5px dashed var(--line);background:var(--surface);padding:14px 16px;font-size:15px;font-weight:600;cursor:pointer;text-align:left;color:var(--ink)}
.menu button:first-child{border-top:0}
.menu button.danger{color:var(--leak)}
.menu button svg.i{width:20px;height:20px;color:var(--muted)}
.menu button.danger svg.i{color:var(--leak)}

/* ===== Layout ===== */
main{max-width:560px;margin:0 auto;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 120px)}
h1,h2,h3{margin:0;letter-spacing:-.015em}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 4px 14px}
.sec-head:first-child{margin-top:4px}
.link{border:0;background:none;color:var(--brand);font-weight:600;font-size:14px;cursor:pointer;padding:4px}

.panel{background:var(--surface);border:3px solid var(--ring);border-radius:22px;padding:16px 18px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}

/* ===== Buttons ===== */
.btn{border:1.5px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.soft{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand)}
.btn.outline{border-color:var(--ink);background:none}
.btn.danger{color:var(--leak);border-color:var(--leak-soft);background:var(--leak-soft)}
.btn.ghost{border-color:transparent;background:none;padding:6px 10px;color:var(--muted)}
.btn.sm{padding:7px 13px;font-size:13.5px}
.btn.lg{padding:13px 20px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg.i{width:19px;height:19px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.center{display:flex;justify-content:center;margin-top:22px}

/* ===== Account-style card ===== */
.acct{background:var(--surface);border:3px solid var(--ring);border-radius:24px;overflow:hidden}
.acct-head{display:flex;align-items:center;gap:12px;min-height:58px}
.acct-head .tag{align-self:stretch;display:flex;align-items:center;background:var(--brand);color:#fff;font-weight:700;font-size:19px;padding:0 44px 0 22px;border-bottom-right-radius:58px 52px}
.acct-head .meta{font-weight:700;font-size:19px;letter-spacing:-.01em;padding-right:16px}
.acct-cols{display:grid;grid-template-columns:1fr 2px 1fr;gap:16px;padding:22px 22px 8px}
.acct-cols .sep{background:repeating-linear-gradient(to bottom,var(--ring) 0 5px,transparent 5px 9px);border-radius:2px}
.acct-cols label{display:block;color:var(--muted);font-size:14.5px}
.acct-cols .v{display:flex;align-items:center;gap:6px;margin-top:8px;white-space:nowrap;font-size:clamp(17px,5.2vw,21px);font-weight:700;letter-spacing:-.01em}
.acct-cols .v.leak{color:var(--leak)}
.eye{border:0;background:none;padding:2px;color:var(--muted);cursor:pointer;display:grid}
.acct-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 22px 22px}
.acct-btns .btn{padding:12px 8px;font-size:15px;white-space:nowrap}

.flow{margin:12px 22px 0;display:flex;height:34px;border-radius:10px;overflow:hidden;gap:3px;background:var(--surface-2)}
.flow-seg{min-width:6px;display:flex;align-items:center;padding:0 8px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);cursor:pointer;border:0;text-align:left}
.flow-seg.ok{background:var(--ok-soft);color:var(--ok)}
.flow-seg.unknown{background:var(--surface-2);color:var(--muted)}
.flow-seg.trial{background:var(--trial-soft);color:var(--trial)}
.flow-seg.warn{background:var(--warn-soft);color:var(--warn)}
.flow-seg.kill{background:repeating-linear-gradient(135deg,var(--leak-soft) 0 7px,color-mix(in srgb,var(--leak) 22%,var(--leak-soft)) 7px 14px);color:var(--leak)}
.flow-empty{flex:1;display:grid;place-items:center;color:var(--muted);font-size:13px}
.legend{display:flex;gap:4px 10px;flex-wrap:wrap;margin:8px 22px 0;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0;background:var(--c)}
.saved-note{margin:12px 22px 0;font-size:13.5px;color:var(--ok);font-weight:600}
.leak-line{margin:10px 22px 0;font-size:13.5px;color:var(--muted)}

.ai-box{margin-top:14px;border-radius:20px;background:var(--brand-soft);padding:14px 16px;white-space:pre-wrap;font-size:14.5px;line-height:1.6;display:none}
.ai-box.show{display:block}
.ai-box .src{display:block;margin-top:8px;font-size:12px;color:var(--muted)}

/* ===== Utilities row ===== */
.utils{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 12px 4px}
.utils::-webkit-scrollbar{display:none}
.util{flex:none;width:92px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-size:14px;line-height:1.35;color:var(--ink);padding:4px 2px}
.util .ico{width:42px;height:42px;display:grid;place-items:center;color:var(--ink);position:relative}
.util .ico svg.i{width:30px;height:30px;stroke-width:1.6}
.util .ico .acc{position:absolute;right:2px;top:0;width:15px;height:15px;color:var(--brand);stroke-width:2.6}

/* ===== Segmented control ===== */
.segc{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:999px;padding:5px;margin-bottom:14px}
.segc button{border:0;background:none;padding:11px 8px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer}
.segc button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* ===== Alerts ===== */
.alerts{display:grid;gap:10px}
.alert{display:flex;gap:12px;align-items:center;padding:14px;border-radius:20px;background:var(--surface);border:3px solid var(--ring);position:relative}
.alert::before{content:"";position:absolute;left:-3px;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--warn))}
.alert .ic{font-size:20px;width:42px;height:42px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.alert .t{font-weight:600;line-height:1.35}
.alert .d{font-size:13px;color:var(--muted);margin-top:2px}
.alert .act{margin-left:auto;flex:none}
.empty{padding:22px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:20px;font-size:14px}

.stat .k{font-size:13.5px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.stat .x{font-size:12.5px;color:var(--muted);margin-top:4px}

/* ===== Item cards (with corner ribbon) ===== */
.list{display:grid;gap:12px}
.item{position:relative;background:var(--surface);border:3px solid var(--ring);border-radius:22px;padding:18px 18px 14px 22px;display:grid;gap:10px;grid-template-columns:1fr auto;align-items:center;overflow:hidden}
.item::before{content:"";position:absolute;left:8px;top:18px;bottom:18px;width:3px;background:repeating-linear-gradient(to bottom,var(--ring) 0 5px,transparent 5px 9px)}
.corner{position:absolute;right:-3px;top:-3px;padding:6px 18px 6px 30px;border-radius:0 22px 0 30px;font-style:italic;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.01em;color:#fff;background:var(--ok)}
.corner.warn{background:var(--warn)} .corner.kill{background:var(--leak)} .corner.trial{background:var(--trial)} .corner.unknown{background:var(--muted)}
.item.has-corner .item-name{padding-right:110px}
.item-name{font-weight:700;font-size:17.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item-meta{font-size:13.5px;color:var(--muted);margin-top:3px}
.item-right{text-align:right}
.item-price{font-weight:700;font-size:17px}
.item-cpu{font-size:12.5px;color:var(--muted);font-weight:500}
.item-foot{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1.5px dashed var(--line);padding-top:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.kill{background:var(--leak-soft);color:var(--leak)} .chip.trial{background:var(--trial-soft);color:var(--trial)}
.uses{display:flex;align-items:center;border-radius:999px;background:var(--surface-2);overflow:hidden}
.uses button{border:0;background:none;width:36px;height:34px;cursor:pointer;font-weight:700;font-size:16px;color:var(--brand)}
.uses span{min-width:78px;text-align:center;font-size:13px;font-weight:600}
.spark{display:flex;gap:3px;align-items:flex-end;height:22px}
.spark i{width:7px;border-radius:2px;background:var(--line)}
.spark i.has{background:var(--brand)}
.tip{font-size:13.5px;color:var(--ink);background:var(--surface-2);border-radius:14px;padding:10px 12px;grid-column:1/-1}

.kill-zone{border:3px solid var(--leak-soft);background:linear-gradient(180deg,var(--leak-soft),var(--surface) 70%);border-radius:24px;padding:18px}
.kill-zone h3{color:var(--leak)}
.kill-card{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--leak-soft);border-radius:18px;padding:12px 14px;margin-top:10px}
.kill-card .n{font-weight:700}
.kill-card .m{font-size:13px;color:var(--muted)}
.kill-card .btn{margin-left:auto}
.mind{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.55}

/* ===== Calendar ===== */
.cal{background:var(--surface);border:3px solid var(--ring);border-radius:22px;overflow:hidden}
.cal-row{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;padding:13px 16px;border-top:1.5px dashed var(--line)}
.cal-row:first-child{border-top:0}
.cal-date{width:54px;height:54px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;text-align:center;font-weight:700;font-size:17px;line-height:1.05}
.cal-date small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.cal-row.soon .cal-date{background:var(--warn-soft);color:var(--warn)}
.cal-row.late .cal-date{background:var(--brand);color:#fff}
.cal-row.late .cal-date small{color:#fff}
.cal-main{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cal-amt{font-weight:700;white-space:nowrap}

.bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:6px}

.debt-tot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.debt-tot .v{font-size:21px;font-weight:700;margin-top:4px}
.owe{color:var(--leak)} .owed{color:var(--ok)}
.done{opacity:.55}
.done .item-name{text-decoration:line-through}

/* ===== Chat ===== */
.chat{display:flex;flex-direction:column;gap:10px;min-height:240px}
.msg{max-width:88%;padding:11px 14px;border-radius:20px;white-space:pre-wrap;font-size:14.5px;line-height:1.6}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.chat-in{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);background:var(--bg);padding:6px 0}

const monthly = s => s.cycle === 'year' ? s.price/12 : s.price;
const myMonthly = s => monthly(s) / Math.max(1, s.payers||1);
const uses3 = s => [0,1,2].map(i => s.usage?.[monthKey(i)]);
function subStatus(s){
  const u = uses3(s);
  if (s.trialEnd && daysUntil(s.trialEnd) >= 0) return 'trial';
  if (u.every(x => x === 0)) return 'kill';
  const known = u.filter(x => typeof x === 'number');
  if (!known.length) return 'unknown';
  const avg = known.reduce((a,b)=>a+b,0)/known.length;
  if (avg === 0) return 'warn';
  return (myMonthly(s)/avg) >= 20000 || avg < 3 ? 'warn' : 'ok';
}
function cpu(s){
  const known = uses3(s).filter(x => typeof x === 'number');
  if (!known.length) return null;
  const avg = known.reduce((a,b)=>a+b,0)/known.length;
  return avg > 0 ? myMonthly(s)/avg : Infinity;
}
const STATUS = {
  ok:{label:'✅ Đáng tiền', cls:'ok'}, warn:{label:'🤔 Cân nhắc', cls:'warn'},
  kill:{label:'✂️ Nên cắt', cls:'kill'}, trial:{label:'⏳ Dùng thử', cls:'trial'}, unknown:{label:'Chưa có dữ liệu', cls:''}
};

/* Roll past billing dates forward; convert finished trials */
function rollForward(){
  let changed = false; const t = today();
  for (const s of state.subs){
    if (s.trialEnd && daysUntil(s.trialEnd) < 0 && !s.trialConverted){
      s.trialConverted = true; s.trialEndedOn = s.trialEnd;
      if (!s.nextBill || parseD(s.nextBill) < parseD(s.trialEnd)) s.nextBill = s.trialEnd;
      s.trialEnd = ''; changed = true;
    }
    if (s.nextBill){
      let d = parseD(s.nextBill); let guard = 0;
      while (d < t && guard++ < 60){ d = s.cycle === 'year' ? addMonths(d,12) : addMonths(d,1); changed = true; }
      s.nextBill = iso(d);
    }
  }
  if (changed) commit(false);
}

function billDue(b){
  const t = today(); const key = ym(t);
  const last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  const thisDue = new Date(t.getFullYear(), t.getMonth(), Math.min(b.dueDay, last));
  if (b.paid?.[key]){
    const n = addMonths(new Date(t.getFullYear(), t.getMonth(), 1), 1);
    const nl = new Date(n.getFullYear(), n.getMonth()+1, 0).getDate();
    return {date: iso(new Date(n.getFullYear(), n.getMonth(), Math.min(b.dueDay, nl))), paidNow:true};
  }
  return {date: iso(thisDue), paidNow:false};
}
function tuitionPlan(x){
  const left = Math.max(0, x.total - (x.saved||0));
  const days = daysUntil(x.due);
  const months = Math.max(1, Math.ceil((days ?? 30)/30.44));
  const perMonth = left <= 0 ? 0 : Math.ceil(left/months/1000)*1000;
  return {left, days, months, perMonth, pct: x.total ? Math.min(100, (x.saved||0)/x.total*100) : 0};
}

function events(horizon=35){
  const ev = [];
  for (const s of state.subs){
    if (s.trialEnd) ev.push({date:s.trialEnd, kind:'trial', icon:'⏳', title:`${s.name}: hết dùng thử`, desc:`Sau ngày này sẽ bị trừ ${money(s.price)} nếu không hủy`, amount:s.price, ref:s.id});
    else if (s.nextBill) ev.push({date:s.nextBill, kind:'renew', icon:'🔁', title:`${s.name}: gia hạn tự động`, desc: subStatus(s)==='kill' ? 'Bạn gần như không dùng dịch vụ này — hủy trước ngày này' : `Kỳ ${s.cycle==='year'?'năm':'tháng'} mới`, amount:s.price, ref:s.id});
  }
  for (const b of state.bills){ const d = billDue(b); ev.push({date:d.date, kind:'bill', icon:'🏠', title:`${b.name}`, desc:`Phần của bạn ${money(b.amount/Math.max(1,b.people))}${b.people>1?` · tổng ${money(b.amount)} chia ${b.people} người`:''}`, amount:b.amount/Math.max(1,b.people), ref:b.id, paid:d.paidNow}); }
  for (const x of state.tuition){ const p = tuitionPlan(x); if (p.left>0) ev.push({date:x.due, kind:'tuition', icon:'🎓', title:`Hạn đóng ${x.name}`, desc:`Còn thiếu ${money(p.left)}`, amount:p.left, ref:x.id}); }
  return ev.map(e => ({...e, n: daysUntil(e.date)}))
    .filter(e => e.n !== null && e.n <= horizon && (e.n >= 0 || (e.kind==='bill' && !e.paid)))
    .sort((a,b) => a.n - b.n);
}
function alertsList(){

  for (const s of state.subs){

    if (s.prevPrice && s.priceChangedAt && (Date.now()-s.priceChangedAt) < 60*864e5 && s.price > s.prevPrice){
      out.push({icon:'📈', title:`${s.name} đã tăng giá`, desc:`${money(s.prevPrice)} → ${money(s.price)} (+${Math.round((s.price/s.prevPrice-1)*100)}%). Một lý do tốt để xem lại gói này.`, c:'var(--muted)', kind:'price', ref:s.id, quiet:true});

    }
  }
  return out;
}

function savings(){
  const cut = (state.cancelled||[]).map(c => ({name:c.name, amt:c.monthly||0}));
  const cutSum = cut.reduce((a,c) => a + c.amt, 0);
  const legacy = Math.max(0, (state.savedFromCancels||0) - cutSum);
  const shared = state.subs.filter(s => (s.payers||1) > 1).map(s => ({name:s.name, full:monthly(s), mine:myMonthly(s), n:s.payers, amt:monthly(s) - myMonthly(s)}));
  const total = cutSum + legacy + shared.reduce((a,x) => a + x.amt, 0);
  const spend = state.subs.reduce((a,s) => a + myMonthly(s), 0);
  const pct = total > 0 ? Math.round(total / (spend + total) * 100) : 0;

      const ps = st.subs.find(x => svcKey(x.name) === k && !x.owner && (x.payers||1) <= 1 && !(x.shareWith||[]).length);
      if (ps) friends.push({acc:a, price: monthly(ps)});
    }
    const n = friends.length ? Math.min(6, friends.length + 1) : 4;
    const P = monthly(s), per = P / n;
    res.push({s, k, friends, n, P, per, pct: Math.round((1 - 1/n) * 100), save: P - per});
  }
  return res.sort((a,b) => (b.friends.length > 0) - (a.friends.length > 0) || b.save - a.save);
}

  sfSum(s);
}
function sfSel(){ return [...dlg.querySelectorAll('#sf-list .dev[aria-pressed="true"]')].map(b => b.dataset.u); }
function sfSum(s){ const el = dlg.querySelector('#sf-sum'); if (!el) return; const n = sfSel().length + 1; el.textContent = n === 1 ? 'Chọn ít nhất 1 người.' : `Nhóm ${n} người · mỗi người ${money(monthly(s)/n)}/tháng (giảm ${Math.round((1-1/n)*100)}%)`; }
function inviteText(s, n){ return `Mình đang trả ${s.name} ${money(monthly(s))}/tháng. Ghép nhóm ${n} người thì mỗi người chỉ còn ${money(monthly(s)/n)}/tháng (giảm ${Math.round((1-1/n)*100)}%). Vào nhóm với mình nhé? 🙌`; }
async function sendInvites(s, users){
  if (!users.length){ toast('Chọn ít nhất 1 người để mời.'); return; }
  const n = Math.min(6, users.length + 1 + (s.shareWith||[]).length);
  for (const u of users){ const a = liveAccounts().find(x => x.username === u); if (a) await pushToAccount(a, {type:'invite', from: current.username, fromName: current.displayName, subId: s.id, svc: s.name, text: inviteText(s, n), amount: 0}); }
  s.invited = [...new Set([...(s.invited||[]), ...users])];
  if (dlg.open) dlg.close();
  commit();
  toast(`📨 Đã gửi lời mời share ${s.name} tới ${users.map(u => '@'+u).join(', ')}.`, 5000);
}
async function acceptInvite(m){
  const sender = liveAccounts().find(a => a.username === m.from); if (!sender){ m.read = true; commit(); return; }
  const sst = await loadState(sender);
  const s = sst.subs.find(x => x.id === m.subId);
  if (!s){ m.read = true; commit(); toast('Gói này không còn tồn tại.'); return; }
  s.shareWith = [...new Set([...(s.shareWith||[]), current.username])];
  s.sharedWith = s.shareWith.length + (s.guests||[]).length + 1; s.payers = s.sharedWith;
  s.invited = (s.invited||[]).filter(u => u !== current.username);
  sst.inbox = [{id:uid(), at:Date.now(), read:false, from: current.username, fromName: current.displayName, text:`Mình đồng ý ghép nhóm ${s.name}! Nhóm giờ có ${s.sharedWith} người, mỗi người ${money(monthly(s)/s.sharedWith)}/tháng.`, amount:0}, ...(sst.inbox||[])];
  await saveState(sender, sst);
  const members = [sender.username, ...s.shareWith]; const k = svcKey(s.name);
  for (const u of s.shareWith){
    const copy = {...s, shareWith: members.filter(x => x !== u), sharedBy: sender.displayName, owner: sender.username, invited: []};
    if (u === current.username){
      state.subs = state.subs.filter(x => !(svcKey(x.name) === k && !x.owner && x.id !== s.id && (x.payers||1) <= 1));
      const i = state.subs.findIndex(x => x.id === s.id); const prev = i >= 0 ? state.subs[i] : null;
      const c = {...copy, usage: prev ? prev.usage : {}, remind: prev ? prev.remind : 3};
      if (i >= 0) state.subs[i] = c; else state.subs.push(c);
    } else {
      const acc = liveAccounts().find(a => a.username === u); if (!acc) continue;
      const st = await loadState(acc); const i = st.subs.findIndex(x => x.id === s.id); const prev = i >= 0 ? st.subs[i] : null;
      const c = {...copy, usage: prev ? prev.usage : {}, remind: prev ? prev.remind : 3};
      if (i >= 0) st.subs[i] = c; else st.subs.push(c);
      await saveState(acc, st);
    }
  }
  m.read = true; commit(); if (dlg.open) notifCenter();
  toast(`🎉 Đã vào nhóm ${s.name} cùng ${sender.displayName.split(' ').slice(-1)[0]}. Phần của bạn: ${money(monthly(s)/s.sharedWith)}/tháng.`, 5000);
  loadPeers();
}

function snapshot(){

    goiDangKy: state.subs.map(s => ({ten:s.name, gia:s.price, chuKy:s.cycle==='year'?'năm':'tháng', phanBanTraMoiThang:Math.round(myMonthly(s)), soNguoiDungChung:s.sharedWith||1, soNguoiCungTra:s.payers||1, solanMo_thangNay_thangTruoc_2thangTruoc:uses3(s).map(x=>x??'chưa nhập'), chiPhiMoiLanDung: (()=>{const c=cpu(s); return c===null?'chưa đo':c===Infinity?'không dùng':Math.round(c);})(), trangThai:STATUS[subStatus(s)].label, ngayGiaHan:s.nextBill||null, hetDungThu:s.trialEnd||null, giaCu:s.prevPrice||null})),
    hocPhi: state.tuition.map(x => { const p=tuitionPlan(x); return {ky:x.name, tong:x.total, daDeDanh:x.saved||0, han:x.due, canDeDanhMoiThang:p.perMonth}; }),

    no: state.debts.filter(d=>!d.settled).map(d => ({nguoi:d.person, soTien:d.amount, chieu:d.dir==='owe'?'mình nợ':'nợ mình', ghiChu:d.note}))
  };

const PERSONA = `Bạn là OptiSub — trợ lý tài chính cá nhân cho học sinh, sinh viên Việt Nam, chuyên về kinh tế học hành vi và tối ưu chi tiêu số. Giọng: thân thiện, thực tế, thẳng thắn nhưng thấu hiểu, như một cố vấn tài chính tận tâm. Khi phù hợp, nhắc đến chi phí chìm (sunk cost fallacy) và hiệu ứng khóa chặt (lock-in effect) để giúp người dùng quyết định cắt giảm dứt khoát. Luôn kèm gợi ý tối ưu chi phí cụ thể (gói gia đình/dùng chung, gói sinh viên, gói năm, bản miễn phí). Dùng emoji vừa phải. Tiền tệ là VND, viết dạng 59.000 ₫. Không bịa giá dịch vụ; chỉ dựa vào dữ liệu được cung cấp. Không dùng markdown đậm hay tiêu đề.`;
function localAnalysis(){
  const subs = state.subs;
  const waste = subs.filter(s=>['kill','warn'].includes(subStatus(s))).sort((a,b)=>(cpu(b)??0)-(cpu(a)??0) || myMonthly(b)-myMonthly(a))[0];
  const ev = events(7).filter(e=>!e.paid)[0];
  const lines = [];
  if (waste){ const c = cpu(waste); lines.push(`• Lãng phí nhất: ${waste.name} — ${money(myMonthly(waste))}/tháng mà ${c===Infinity?'gần như không dùng':`mỗi lần mở tốn ${money(c)}`}. Tiền đã trả là chi phí chìm, đừng để nó giữ chân bạn.`); }
  else lines.push(`• Chưa thấy gói nào lãng phí rõ rệt. Chọn mức dùng mỗi tháng để số liệu chính xác hơn.`);
  if (ev) lines.push(`• Sắp tới hạn: ${ev.title} (${fmtDate(ev.date)}, ${whenText(ev.n)}) — ${money(ev.amount)}.`);
  else lines.push(`• Không có khoản nào tới hạn trong 7 ngày tới.`);
  const shared = subs.find(s=>(s.sharedWith||1)>1 && (s.payers||1)<=1);
  if (waste && subStatus(waste)==='kill') lines.push(`• Hành động: hủy ${waste.name} ngay hôm nay theo hướng dẫn trong OptiSub — tiết kiệm ${money(myMonthly(waste)*12)}/năm.`);
  else if (shared) lines.push(`• Hành động: rủ ${shared.sharedWith-1} người đang dùng chung ${shared.name} góp tiền — phần bạn còn ${money(monthly(shared)/shared.sharedWith)}/tháng.`);
  else if (waste) lines.push(`• Hành động: hạ ${waste.name} xuống gói rẻ hơn hoặc tạm dừng 1 tháng xem có nhớ không.`);
  else { const t = state.tuition.map(tuitionPlan).find(p=>p.perMonth>0); lines.push(t?`• Hành động: chuyển ${money(t.perMonth)} vào quỹ học phí ngay khi nhận tiền tháng này.`:`• Hành động: đặt nhắc nhở lịch cho các ngày gia hạn để không bị trừ tiền bất ngờ.`); }
  return lines.join('\n');
}
async function runAnalysis(){
  const btn = document.querySelector('[data-act="analyze"]');
  if (!caps.sample){ analysis = {text: localAnalysis(), src:'Phân tích nhanh bằng bộ quy tắc của OptiSub'}; render(); return; }
  analysis = {text:'Đang quét dữ liệu…', src:''}; render();
  const box = $('#ai-box'); const b = document.querySelector('[data-act="analyze"]'); if (b) b.disabled = true;
  const prompt = `${PERSONA}\n\nNhiệm vụ “Phân tích ngay”: quét nhanh dữ liệu dưới đây và trả lời ĐÚNG 3 dòng, mỗi dòng bắt đầu bằng “• ”, mỗi dòng tối đa 40 từ, không thêm lời mở đầu hay kết luận.\nDòng 1: khoản đang lãng phí nhất (nêu tên và số tiền, chi phí mỗi lần dùng).\nDòng 2: khoản sắp tới hạn gần nhất (ngày, số tiền).\nDòng 3: một hành động cụ thể nên làm ngay hôm nay.\n\nDỮ LIỆU (JSON):\n${JSON.stringify(snapshot())}`;
  try {
    const r = await caps.sample(prompt, {modelTier:'quick', onText:({text}) => { analysis.text = text; const bx=$('#ai-box'); if (bx) bx.textContent = text; }});
    analysis = {text:r.text.trim(), src:'Phân tích bởi OptiSub'};
  } catch(e){
    analysis = {text: localAnalysis(), src: e?.code==='not_granted' ? 'Bạn chưa cho phép hỏi Claude — dùng bộ quy tắc của OptiSub' : 'Chưa phân tích chi tiết được lúc này — dùng bộ quy tắc của OptiSub'};
  }
  render();
}

async function sendChat(q){
  if (!q.trim() || chatBusy || !caps.sample) return;
  chatBusy = true;
  chatLog.push({role:'user', content:q.trim()});
  chatLog.push({role:'assistant', content:'Đang suy nghĩ…'});
  render();
  window.scrollTo(0, document.body.scrollHeight);
  const turns = chatLog.slice(0,-1).slice(-10);
  const ctx = `${PERSONA}\nNếu người dùng nói “Phân tích ngay”: chỉ ra khoản lãng phí nhất, khoản sắp tới hạn và lời khuyên hành động, đúng 3 gạch đầu dòng ngắn. Các câu khác: trả lời ngắn gọn, trực quan, tối đa ~150 từ.\n\nDỮ LIỆU HIỆN TẠI CỦA NGƯỜI DÙNG (JSON):\n${JSON.stringify(snapshot())}\n\nTin nhắn của người dùng: `;
  const input = turns.map((m,i) => i===turns.length-1 ? {role:'user', content: ctx + m.content} : m);
  if (input[0].role !== 'user') input.shift();
  try {
    const r = await caps.sample(input, {cache:false, onText:({text}) => { chatLog[chatLog.length-1].content = text; const msgs = document.querySelectorAll('#chat .msg.a'); const last = msgs[msgs.length-1]; if (last) last.textContent = text; }});

const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function hashPw(pw, saltB64){
  if (!window.crypto?.subtle) throw new Error('nocrypto');
  const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, key, 256));
}
function newSalt(){ const s = new Uint8Array(16); crypto.getRandomValues(s); return b64(s); }

  const map = new Map(accounts.map(a => [a.id, a]));
  for (const r of remote){ const l = map.get(r.id); if (!l || (r.updatedAt||0) > (l.updatedAt||0)) map.set(r.id, r); }
  accounts = [...map.values()];

}

  f.value = digits ? NF.format(Number(digits)) : '';
  let pos = 0, seen = 0;
  while (pos < f.value.length && seen < digitsBefore){ if (/\d/.test(f.value[pos])) seen++; pos++; }
  try { f.setSelectionRange(pos, pos); } catch(err){}
});

/* Ghép nối: đẩy gói dùng chung sang app của các tài khoản được chọn */
async function syncShared(s, removed=[]){
  const me = current; const members = [me.username, ...(s.shareWith||[])];
  const targets = [...(s.shareWith||[]).map(u => [u,true]), ...removed.map(u => [u,false])];
  for (const [u, keep] of targets){
    const acc = liveAccounts().find(a => a.username === u); if (!acc || acc.id === me.id) continue;
    const key = 'optisub.v1.' + acc.id;
    let st = readJSON(localStorage, key);
    const ref = cloud.db && cloud.cid ? cloud.db.doc(`data/users/${cloud.cid}/optisub-${acc.id}`) : null;
    if (ref){ try { const snap = await ref.get(); if (snap.exists){ const d = snap.data(); if (!st || (d.updatedAt||0) > (st.updatedAt||0)) st = JSON.parse(d.payload); } } catch(e){} }
    st = st && st.v ? Object.assign(emptyState(), st) : Object.assign(demoState(acc.kind), {updatedAt:1});
    const i = st.subs.findIndex(x => x.id === s.id);
    if (keep){
      const prev = i >= 0 ? st.subs[i] : null;
      const copy = {...s, usage: prev ? prev.usage : {}, remind: prev ? prev.remind : s.remind, cancelTodo: prev ? prev.cancelTodo : false, shareWith: members.filter(x => x !== u), sharedBy: me.displayName, owner: me.username};
      if (i >= 0) st.subs[i] = copy; else st.subs.push(copy);
    } else if (i >= 0 && st.subs[i].owner === me.username) st.subs.splice(i, 1);
    st.updatedAt = Date.now();
    writeJSON(localStorage, key, st);
    if (ref){ try { await ref.set({payload: JSON.stringify(st), updatedAt: st.updatedAt}); } catch(e){} }
  }
}
function saveSub(id){
  const name = val('f-name').trim(); const price = numv('f-price');
  if (!name || !price){ toast('Nhập tên dịch vụ và giá để lưu.'); return; }
  let s = state.subs.find(x=>x.id===id); const isNew = !s;
  if (isNew){ s = {id:uid(), usage:{}, createdAt:Date.now()}; state.subs.push(s); }
  else if (price > s.price){ s.prevPrice = s.price; s.priceChangedAt = Date.now(); }
  else if (price < s.price){ s.prevPrice = 0; }
  Object.assign(s, {name, price, cycle:val('f-cycle'), nextBill:val('f-next'), trialEnd:val('f-trial'), remind:Number(val('f-remind'))});
  const before = s.shareWith || []; const sel = shareSel();
  if (!s.owner || s.owner === current.username){
    const pending = val('f-share-in').trim(); if (pending) shareAdd(pending);
    const guestsBefore = s.guests || [];
    s.shareWith = sel; s.guests = [...shareDraft.guests]; s.sharedWith = sel.length + s.guests.length + 1; s.payers = s.sharedWith; delete s.owner; delete s.sharedBy;
    const newGuests = s.guests.filter(g => !guestsBefore.includes(g));
    if (newGuests.length && dlg.querySelector('#f-share-debt')?.checked){
      const share = Math.round(monthly({...s, price}) / s.sharedWith / 1000) * 1000;
      newGuests.forEach(g => state.debts.push({id:uid(), person:g, amount:share, dir:'owed', note:`Phần ${name} tháng ${today().getMonth()+1}`, date:iso(today()), settled:false}));
      setTimeout(() => toast(`📒 Đã ghi ${newGuests.join(', ')} nợ ${money(share)} vào Sổ nợ bạn bè.`, 4500), 1200);
    }
    const removed = before.filter(u => !sel.includes(u));
    if (sel.length || removed.length) syncShared(s, removed).then(() => { if (sel.length) toast(`🔗 Đã ghép nối ${s.name} với ${sel.map(u => '@'+u).join(', ')}.`, 4500); });
  }
  if (s.trialEnd) s.trialConverted = false;
  dlg.close(); commit();
  if (isNew){ const t = tipFor(s); toast(`✅ Đã thêm ${s.name} (${money(s.price)}/${s.cycle==='year'?'năm':'tháng'}).${t?' '+t:' 💡 Chọn mức dùng (Không dùng / Ít / Hằng tuần / Hằng ngày) trên thẻ gói để đo chi phí thật.'}`, 7000); }
  else toast('Đã lưu thay đổi.');
}

function showPush(){
  if (!current) return;
  const list = alertsList().filter(a => !a.quiet); if (!list.length) return;
  const key = 'optisub.pushed.' + current.id + '.' + iso(today());
  try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch(e){}
  const a = list[0];
  $('#push').innerHTML = `<span class="pi">${LOGO.replace(/var\(--brand\)/g,'#fff')}</span><span style="flex:1;min-width:0"><span class="pm"><span>OptiSub</span><span>bây giờ</span></span><div class="pt">${a.icon} ${esc(a.title)}${a.n!==undefined?` — ${whenText(a.n)}`:''}</div><div class="pb">${esc(a.desc)}${list.length>1?` · và ${list.length-1} thông báo khác`:''}</div></span>`;
  requestAnimationFrame(() => $('#push').classList.add('show'));
  clearTimeout(pushT); pushT = setTimeout(hidePush, 7000);
}

/* ============ Misc actions ============ */
let toastT;
function toast(msg, ms=3500){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), ms); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast('Đã sao chép 📋'); }
  catch(e){ const ta = dlg.querySelector('#m-body'); if (ta){ ta.select(); } toast('Đã chọn sẵn nội dung — nhấn Ctrl/⌘+C để sao chép.'); }
}
function buildICS(){
  const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const escI = s => String(s).replace(/[,;\\]/g, m=>'\\'+m).replace(/\n/g,'\\n');
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//OptiSub//VI','CALSCALE:GREGORIAN'];
  for (const e of events(370)){
    if (e.n < 0) continue;
    const d = e.date.replace(/-/g,''); const end = iso(addDays(parseD(e.date),1)).replace(/-/g,'');
    lines.push('BEGIN:VEVENT',`UID:${e.kind}-${e.ref}-${d}@optisub`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${end}`,`SUMMARY:${escI(e.icon+' '+e.title+' — '+money(e.amount))}`,`DESCRIPTION:${escI(e.desc)}`,
      ...(() => { const s = state.subs.find(x => x.id === e.ref); const r = s ? (s.remind ?? 3) : 3; return r > 0 ? ['BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${escI('Còn '+r+' ngày: '+e.title)}`,`TRIGGER:-P${r}D`,'END:VALARM'] : []; })(),
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${escI('Ngày mai: '+e.title)}`,'TRIGGER:-P1D','END:VALARM','END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

  const u = (a,b,c) => ({[monthKey(0)]:a,[monthKey(1)]:b,[monthKey(2)]:c});
  state.subs = [
    {id:uid(), name:'Netflix', price:260000, cycle:'month', nextBill:d(2), trialEnd:'', sharedWith:1, payers:1, usage:u(0,0,0), email:''},
    {id:uid(), name:'ChatGPT Plus', price:520000, cycle:'month', nextBill:d(12), trialEnd:'', sharedWith:1, payers:1, usage:u(38,52,47), email:''},
    {id:uid(), name:'Canva Pro', price:130000, cycle:'month', nextBill:d(18), trialEnd:'', sharedWith:1, payers:1, usage:u(1,0,2), email:''},
    {id:uid(), name:'YouTube Premium', price:79000, cycle:'month', nextBill:d(9), trialEnd:'', sharedWith:3, payers:1, usage:u(40,44,39), email:''},
    {id:uid(), name:'Spotify Premium', price:59000, cycle:'month', nextBill:'', trialEnd:d(2), sharedWith:1, payers:1, usage:u(6,undefined,undefined), email:''},
    {id:uid(), name:'iCloud+', price:25000, cycle:'month', nextBill:d(21), trialEnd:'', sharedWith:1, payers:1, usage:u(20,22,25), email:'', prevPrice:19000, priceChangedAt:Date.now()-5*864e5}
  ];
  state.subs.forEach(s => Object.keys(s.usage).forEach(k => s.usage[k]===undefined && delete s.usage[k]));
  state.tuition = [{id:uid(), name:'Học kỳ 2, 2026–2027', total:12500000, saved:2000000, due:iso(addMonths(t,4))}];
  state.bills = [
    {id:uid(), name:'Tiền nhà', amount:4500000, dueDay:Math.min(28,t.getDate()+1), people:3, roommates:'Minh, Lan', paid:{}},
    {id:uid(), name:'Điện', amount:620000, dueDay:10, people:3, roommates:'Minh, Lan', paid:{[ym(t)]:true}},
    {id:uid(), name:'Wifi', amount:220000, dueDay:15, people:3, roommates:'Minh, Lan', paid:{[ym(t)]:true}}
  ];
  state.debts = [
    {id:uid(), person:'Minh', amount:85000, dir:'owed', note:'Trà sữa', date:d(-6), settled:false},
    {id:uid(), person:'Lan', amount:120000, dir:'owe', note:'Vé xem phim', date:d(-3), settled:false}
  ];
  commit(); toast('Đã nạp dữ liệu mẫu — thử bấm “Phân tích ngay” nhé ⚡');
}

/* ============ Event delegation ============ */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act],[data-tab]'); if (!el) return;
  const act = el.dataset.act; const id = el.dataset.id;
  if (!act && el.dataset.tab){ goTab(el.dataset.tab); return; }
  switch(act){
    case 'go': goTab(el.dataset.tab); break;
    case 'sub': sub = el.dataset.s; render(); break;
    case 'ovseg': ovSeg = el.dataset.s; render(); break;
    case 'eye': hideAmt = !hideAmt; try { localStorage.setItem('optisub.hide', hideAmt?'1':'0'); } catch(e){} render(); break;
    case 'tier': case 'savings': savingsSheet(); break;
    case 'close': dlg.close(); break;
    case 'auth-mode': authMode = 'login'; authErr = ''; renderAuth(); break;
    case 'toggle-pw': { ev.preventDefault(); showPw = !showPw; ['a-pw','a-pw2'].forEach(k => { const f = $('#'+k); if (f) f.type = showPw ? 'text' : 'password'; }); el.innerHTML = showPw ? I.eyeOff : I.eye; el.setAttribute('aria-label', showPw ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'); el.setAttribute('aria-pressed', String(showPw)); const f = $('#a-pw'); if (f){ f.focus(); const n = f.value.length; try { f.setSelectionRange(n, n); } catch(e){} } break; }
    case 'login': doLogin(); break;
    case 'register': break;
    case 'pick-acc': prefillUser = el.dataset.u; authErr = ''; renderAuth(); $('#a-pw').focus(); break;
    case 'forgot': openDlg('Quên mật khẩu', `<p style="margin:0">Đây là bản demo với 5 tài khoản được cấp sẵn.</p><p class="sub" style="margin:0">Hãy hỏi người tổ chức buổi demo để lấy lại mật khẩu.</p>`, `<button class="btn primary" data-act="close">Đã hiểu</button>`); break;
    case 'forgot-new': dlg.close(); authMode = 'register'; authErr = ''; prefillUser = ''; renderAuth(); break;
    case 'account': accountSheet(); break;
    case 'logout': logout(); break;
    case 'rename': openDlg('Đổi tên hiển thị', `<label class="f">Tên hiển thị<input id="c-name" value="${esc(current.displayName)}"></label>`, `<button class="btn" data-act="close">Huỷ</button><button class="btn primary" data-act="save-name">Lưu</button>`); break;
    case 'save-name': { const n = val('c-name').trim(); if (!n){ toast('Tên không được để trống.'); return; } current.displayName = n; current.updatedAt = Date.now(); await saveAccounts(); dlg.close(); render(); toast('Đã đổi tên.'); break; }
    case 'chpw': openDlg('Đổi mật khẩu', `<label class="f">Mật khẩu hiện tại<input id="c-old" type="password" autocomplete="current-password"></label><label class="f">Mật khẩu mới<input id="c-new" type="password" autocomplete="new-password" placeholder="Ít nhất 6 ký tự"></label><label class="f">Nhập lại mật khẩu mới<input id="c-new2" type="password" autocomplete="new-password"></label>`, `<button class="btn" data-act="close">Huỷ</button><button class="btn primary" data-act="save-pw">Đổi mật khẩu</button>`); break;
    case 'save-pw': changePassword(); break;
    case 'del-acc': openDlg('Xóa tài khoản?', `<div class="err">Toàn bộ gói đăng ký, học phí, hóa đơn và sổ nợ của tài khoản @${esc(current.username)} sẽ bị xóa vĩnh viễn.</div><label class="f">Nhập mật khẩu để xác nhận<input id="c-old" type="password" autocomplete="current-password"></label>`, `<button class="btn" data-act="close">Huỷ</button><button class="btn danger" data-act="confirm-del">Xóa vĩnh viễn</button>`); break;
    case 'confirm-del': deleteAccount(); break;
    case 'reset-demo': if (confirm('Khôi phục dữ liệu mẫu ban đầu cho tài khoản này? Mọi thay đổi sẽ mất.')){ state = demoState(current.kind); dlg.close(); commit(); toast('🔄 Đã khôi phục dữ liệu mẫu.'); } break;
    case 'seed': seed(); break;
    case 'analyze': runAnalysis(); break;
    case 'add-sub': subForm(); break;
    case 'edit-sub': subForm(state.subs.find(s=>s.id===id)); break;
    case 'save-sub': saveSub(id); break;
    case 'del-sub': if (confirm('Xóa gói này khỏi danh sách?')){ const s = state.subs.find(x=>x.id===id); if (s && !s.owner && (s.shareWith||[]).length) syncShared({...s, shareWith:[]}, s.shareWith); state.subs = state.subs.filter(s=>s.id!==id); dlg.close(); commit(); } break;
    case 'share-add': shareAdd(val('f-share-in')); break;
    case 'share-pick': shareAdd('@' + el.dataset.u); break;
    case 'share-rm': if (el.dataset.u) shareDraft.users = shareDraft.users.filter(u => u !== el.dataset.u); else shareDraft.guests.splice(Number(el.dataset.g), 1); renderShare(); break;
    case 'freq': { const s = state.subs.find(x=>x.id===id); s.usage[monthKey(0)] = Number(el.dataset.v); commit(); break; }
    case 'use': { const s = state.subs.find(x=>x.id===id); const k = monthKey(0); s.usage[k] = Math.max(0,(s.usage[k]||0) + Number(el.dataset.d)); commit(); break; }
    case 'cancel': cancelDlg(id); break;
    case 'remind-cancel': { const s = state.subs.find(x=>x.id===id); s.cancelTodo = !s.cancelTodo; commit(); dlg.close(); toast(s.cancelTodo ? `🔔 OptiSub sẽ nhắc bạn hủy ${s.name} mỗi lần mở app cho đến khi xong.` : 'Đã bỏ nhắc hủy.', 4500); break; }
    case 'notifs': hidePush(); notifCenter(); break;
    case 'copy-mail': copy(`Tiêu đề: ${val('m-subj')}\n\n${val('m-body')}`); break;
    case 'copy-text': copy(val('m-body')); break;
    case 'mark-cancelled': { const s = state.subs.find(x=>x.id===id); state.savedFromCancels = (state.savedFromCancels||0) + myMonthly(s); state.cancelled.push({name:s.name, monthly:myMonthly(s), at:Date.now()}); state.subs = state.subs.filter(x=>x.id!==id); dlg.close(); commit(); toast(`🎉 Đã cắt ${s.name}. Bạn vừa giữ lại ${money(myMonthly(s)*12)} mỗi năm.`, 5000); break; }
    case 'add-tuition': tuitionForm(); break;
    case 'edit-tuition': tuitionForm(state.tuition.find(x=>x.id===id)); break;
    case 'save-tuition-form': { const name = val('t-name').trim(); const total = numv('t-total'); const due = val('t-due'); if (!name||!total||!due){ toast('Nhập tên kỳ, tổng học phí và hạn đóng.'); return; } let x = state.tuition.find(t=>t.id===id); if (!x){ x = {id:uid()}; state.tuition.push(x); } Object.assign(x,{name,total,due,saved:numv('t-saved')}); dlg.close(); commit(); const p = tuitionPlan(x); toast(`🎓 Cần để dành ${money(p.perMonth)}/tháng trong ${p.months} tháng.`, 5000); break; }
    case 'del-tuition': state.tuition = state.tuition.filter(x=>x.id!==id); dlg.close(); commit(); break;
    case 'save-tuition': openDlg('Ghi nhận đã để dành', `<label class="f">Số tiền vừa để dành (₫)<input id="s-amt" class="money" type="text" inputmode="numeric" autocomplete="off" placeholder="500.000"></label>`, `<button class="btn" data-act="close">Huỷ</button><button class="btn primary" data-act="add-saving" data-id="${id}">Ghi nhận</button>`); break;
    case 'add-saving': { const x = state.tuition.find(t=>t.id===id); x.saved = (x.saved||0) + numv('s-amt'); dlg.close(); commit(); toast('💪 Đã cộng vào quỹ học phí.'); break; }
    case 'add-bill': billForm(); break;
    case 'edit-bill': billForm(state.bills.find(b=>b.id===id)); break;
    case 'save-bill': { const name = val('b-name').trim(); const amount = numv('b-amount'); if (!name||!amount){ toast('Nhập tên và số tiền hóa đơn.'); return; } let b = state.bills.find(x=>x.id===id); if (!b){ b = {id:uid(), paid:{}}; state.bills.push(b); } Object.assign(b,{name, amount, dueDay:Math.min(31,Math.max(1,numv('b-day')||1)), people:Math.max(1,numv('b-people')||1), roommates:val('b-room').trim()}); dlg.close(); commit(); if (b.people>1) toast(`🏠 Mỗi người trả ${money(b.amount/b.people)}.`); break; }
    case 'del-bill': state.bills = state.bills.filter(b=>b.id!==id); dlg.close(); commit(); break;
    case 'pay-bill': { const b = state.bills.find(x=>x.id===id); const k = ym(today()); b.paid = b.paid||{}; if (b.paid[k]) delete b.paid[k]; else b.paid[k] = true; commit(); break; }
    case 'split-msg': { const b = state.bills.find(x=>x.id===id); const share = money(b.amount/b.people); const tos = (b.roommates||'').split(/[,;]+/).map(matchAcc).filter(Boolean).map(a => a.username); textDlg('Tin nhắn chia tiền', `Hi ${b.roommates||'cả nhà'} 👋 ${b.name} tháng ${today().getMonth()+1} hết ${money(b.amount)}, chia ${b.people} người là ${share}/người. Hạn đóng ngày ${b.dueDay} nha, mọi người chuyển cho mình trước hôm đó giúp mình nhé. Cảm ơn! 🙏`, {to: tos, amount: Math.round(b.amount/b.people), note: `${b.name} tháng ${today().getMonth()+1}`}); break; }
    case 'add-debt': debtForm(); break;
    case 'save-debt': { const person = val('d-person').trim(); const amount = numv('d-amount'); if (!person||!amount){ toast('Nhập tên và số tiền.'); return; } state.debts.push({id:uid(), person, amount, dir:val('d-dir'), date:val('d-date')||iso(today()), note:val('d-note').trim(), settled:false}); dlg.close(); commit(); break; }
    case 'settle': { const d = state.debts.find(x=>x.id===id); d.settled = !d.settled; commit(); if (d.settled) toast('✅ Đã gạch nợ.'); break; }
    case 'del-debt': state.debts = state.debts.filter(x=>x.id!==id); commit(); break;
    case 'remind': { const d = state.debts.find(x=>x.id===id); const m = d.username ? liveAccounts().find(a => a.username === d.username) : matchAcc(d.person); textDlg('Nhắc khéo', `Ê ${d.person} ơi, khoản ${money(d.amount)}${d.note?` (${d.note})`:''} hôm ${fmtDate(d.date)} nhớ chuyển mình khi tiện nha 😄 Cảm ơn bạn!`, {to: m ? [m.username] : [], amount: d.amount, note: d.note, debtId: d.id}); break; }
    case 'msg-pick': { const f = $('#m-to'); const cur = f.value.split(/[\s,;]+/).filter(Boolean); const u = '@' + el.dataset.u; if (!cur.includes(u)) cur.push(u); f.value = cur.join(', '); break; }
    case 'msg-send': sendInApp(); break;
    case 'smart-next': smartIdx++; render(); break;
    case 'smart-find': smartFind(id); break;
    case 'smart-invite': { const m = smartMatches().find(x => x.s.id === id); if (m) sendInvites(m.s, m.friends.map(f => f.acc.username)); break; }
    case 'sf-toggle': { el.setAttribute('aria-pressed', String(el.getAttribute('aria-pressed') !== 'true')); const s = state.subs.find(x => x.id === dlg.querySelector('[data-act="sf-send"]').dataset.id); sfSum(s); break; }
    case 'sf-send': { const s = state.subs.find(x => x.id === id); sendInvites(s, sfSel()); break; }
    case 'sf-copy': { const s = state.subs.find(x => x.id === id); const t = inviteText(s, Math.max(2, sfSel().length + 1)); try { await navigator.clipboard.writeText(t); toast('Đã sao chép lời mời 📋'); } catch(e){ textDlg('Lời mời ghép nhóm', t); } break; }
    case 'invite-accept': { const m = (state.inbox||[]).find(x => x.id === id); if (m) acceptInvite(m); break; }
    case 'msg-read': { const m = (state.inbox||[]).find(x => x.id === id); if (m){ m.read = true; commit(); if (dlg.open) notifCenter(); } break; }
    case 'msg-debt': { const m = (state.inbox||[]).find(x => x.id === id); if (m){ m.read = true; state.debts.push({id:uid(), person:m.fromName.split(' ').slice(-1)[0], username:m.from, amount:m.amount, dir:'owe', note:m.note||'Theo nhắc trong app', date:iso(today()), settled:false}); commit(); if (dlg.open) notifCenter(); toast('📒 Đã ghi vào Mượn & Trả (cần trả).'); } break; }
    case 'ics': { try { await caps.downloads.save({filename:'optisub-nhac-thanh-toan.ics', data:buildICS()}); } catch(e){ if (e?.code!=='declined' && e?.code!=='cancelled') toast('Chưa lưu được tệp lịch.'); } break; }
    case 'ask': tab = 'ai'; sendChat(el.dataset.q); window.scrollTo(0, document.body.scrollHeight); break;
    case 'send': { const t = $('#chat-text'); const q = t.value; t.value=''; sendChat(q); break; }
    case 'clear-chat': chatLog = []; render(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key==='Enter' && e.target.closest && e.target.closest('#auth-form') && e.target.tagName==='INPUT' && e.target.type!=='checkbox'){ e.preventDefault(); doLogin(); return; }
  if (e.target.id==='f-share-in' && e.key==='Enter'){ e.preventDefault(); shareAdd(e.target.value); return; }
  if (e.target.id==='chat-text' && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); const q = e.target.value; e.target.value=''; sendChat(q); }
});
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

/* ============ Boot ============ */
(() => {
  const ses = readSession();
  const acc = ses && liveAccounts().find(a => a.id === ses.accountId);
  if (acc) enterAccount(acc); else { render(); }
})();
(async () => {
  if (!window.claude || !window.claude.use){ cloudReadyResolve(); return; }
  claude.use('sample').then(s => { caps.sample = s; if (s && tab==='ai' && current) render(); });
  claude.use('downloads').then(d => { caps.downloads = d; if (d && current) render(); });
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user){ cloudReadyResolve(); return; }
    try { const me = await user.me(); if (me && me.name && !claudeName){ claudeName = me.name; if (!current && authMode==='register' && !$('#a-name')?.value) renderAuth(); } } catch(e){}
    const cid = await user.id(); if (!cid){ cloudReadyResolve(); return; }
    cloud.db = db; cloud.cid = cid;
    try { const r = await accDocRef().get(); if (r.exists){ mergeAccounts(JSON.parse(r.data().payload)); } else if (accounts.length) saveAccounts(); } catch(e){}
    try { const lg = await db.doc(`data/users/${cid}/optisub`).get(); if (lg.exists) cloud.legacy = JSON.parse(lg.data().payload); } catch(e){}
    cloudReadyResolve();
    if (current){
      if (!caps.docRef) enterAccount(current);
    } else {
      const ses = readSession(); const acc = ses && liveAccounts().find(a => a.id === ses.accountId);
      if (acc) enterAccount(acc);
      else { if (liveAccounts().length && authMode==='register' && !$('#a-name')?.value && !$('#a-user')?.value) authMode = 'login'; renderAuth(); }
    }
  } catch(e){ cloudReadyResolve(); }
})();
